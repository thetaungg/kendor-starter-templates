# yaml-language-server: $schema=https://kendor.dev/config-schema/v1
# Spring Boot (Maven) web starter. The candidate builds REST endpoints in GreetingController.java; the
# app runs behind the Kendor preview proxy on the sandbox port. Grading runs the suite harness:
# `mvn test`, Surefire's JUnit XML converted to TAP. The install runs the tests once with failures
# ignored: Surefire downloads its JUnit provider only when tests run, and grading cuts the network
# first. `|| true` keeps code that doesn't compile a zero score rather than a failed grade.
version: 1
runtime:
  type: java
  version: "21"
services:
  app:
    install:
      commands:
        - mvn -B -q -Dmaven.test.failure.ignore=true test 1>&2 || true
    dev:
      # devtools restarts the app when a class changes; `mvn compile` in the terminal triggers it.
      command: SERVER_PORT=$PORT mvn -B -q spring-boot:run
      port: 8080
    test:
      # Old reports go first so a failed compile can't be scored from the last run. Maven's output
      # (and anything the code prints) goes to stderr; only the TAP is scored.
      command: rm -rf target/surefire-reports; mvn -B -q test 1>&2; kendor-junit-tap 'target/surefire-reports/*.xml'
preview:
  service: app
kendor:
  category: Project
  title: Spring Boot
  entryFile: src/main/java/com/example/demo/GreetingController.java
  order: 0
  gradeService: app
  readonlyPaths:
    - src/test/
