# yaml-language-server: $schema=https://kendor.dev/config-schema/v1
# Single-file Java challenge. The candidate edits Solution.java; the hidden test (SolutionTest.java)
# grades it via the suite harness: javac + the JUnit console launcher from the Java toolchain folder,
# its XML reports converted to TAP. Program output goes to stderr, so only the TAP is scored. The
# .solution/ reference is stripped from the seed.
version: 1
runtime:
  type: java
  version: "21"
services:
  app:
    test:
      command: >-
        rm -rf /opt/kendor/scratch/junit &&
        javac -d /opt/kendor/scratch/junit/classes -cp "$JUNIT_CONSOLE" *.java &&
        java -jar "$JUNIT_CONSOLE" execute --disable-banner --details=none
        -cp /opt/kendor/scratch/junit/classes --scan-classpath
        --reports-dir=/opt/kendor/scratch/junit/reports 1>&2;
        kendor-junit-tap /opt/kendor/scratch/junit/reports
kendor:
  type: SINGLE_FILE
  title: "Interval Merging"
  difficulty: easy
  category: Algorithms
  tags: [intervals, sorting, java]
  gradeService: app
  editablePaths:
    - Solution.java
  solutionDir: .solution
  readonlyPaths:
    - SolutionTest.java
