# yaml-language-server: $schema=https://kendor.dev/config-schema/v1
# Single-file C++ challenge starter. The candidate edits solution.cpp; the hidden test
# (solution_test.cpp) grades it via the suite harness: clang++ from the C++ toolchain folder, linked
# with its prebuilt Catch2, Catch2's JUnit report converted to TAP. The build lands in the scratch
# tmpfs and program output goes to stderr, so only the TAP is scored. No preview.
version: 1
runtime:
  type: cpp
  version: "23"
services:
  app:
    test:
      command: >-
        rm -rf /opt/kendor/scratch/cpp && mkdir -p /opt/kendor/scratch/cpp &&
        clang++ -std=c++20 -O1 -o /opt/kendor/scratch/cpp/tests *.cpp "$CATCH2_DIR/catch_amalgamated.o" &&
        /opt/kendor/scratch/cpp/tests --reporter junit::out=/opt/kendor/scratch/cpp/report.xml 1>&2;
        kendor-junit-tap /opt/kendor/scratch/cpp/report.xml
kendor:
  type: SINGLE_FILE
  title: Single file
  entryFile: solution.cpp
  order: 10
  gradeService: app
  editablePaths:
    - solution.cpp
