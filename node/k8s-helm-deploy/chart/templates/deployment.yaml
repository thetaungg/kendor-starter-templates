apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  # TODO: take the replica count from values.yaml
  replicas: 1
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: orders-api
          # TODO: image and pull policy from values.yaml
          image: orders-api:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: GREETING
              value: hello
