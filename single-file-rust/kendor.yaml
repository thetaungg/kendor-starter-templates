# yaml-language-server: $schema=https://kendor.dev/config-schema/v1
# Single-file Rust challenge starter. The candidate edits src/lib.rs; the hidden integration test
# (tests/solution_test.rs) grades it via the suite harness (cargo test → TAP). No dependencies, so
# nothing to install. No preview.
version: 1
runtime:
  type: rust
  version: "1.98"
services:
  app:
    test:
      command: cargo test --color never 2>&1 | kendor-cargo-tap
kendor:
  type: SINGLE_FILE
  title: Single file
  entryFile: src/lib.rs
  order: 10
  gradeService: app
  editablePaths:
    - src/lib.rs
